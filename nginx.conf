server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Behind a Cloudflare Tunnel the real client IP arrives in this header.
  real_ip_header CF-Connecting-IP;

  # Never cache the pages themselves, or you'll push a change and still
  # see the old version on your phone.
  location ~* \.html$ {
    add_header Cache-Control "no-cache, must-revalidate";
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=3600";
  }

  # Browsers are picky about the manifest's content type; nginx's default
  # mime.types doesn't know the extension, so it's set explicitly here.
  location = /assets/manifest.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "public, max-age=3600";
  }

  # Same "always fresh" rule as *.html — a stale service worker is stickier
  # than a stale page, so never let it be cached.
  location = /sw.js {
    add_header Cache-Control "no-cache, must-revalidate";
  }

  location / {
    try_files $uri $uri/ =404;
  }

  gzip on;
  gzip_types text/css application/javascript text/html;
}
