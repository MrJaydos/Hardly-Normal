<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B1220">
<title>Toolshed</title>
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<main class="shell">

  <span class="eyebrow">Toolshed</span>
  <h1>Pick a tool.</h1>
  <p class="lede">Small things that do one job each.</p>

  <div class="rule"></div>

  <nav class="tiles">

    <a class="tile" href="/hardly-normal/">
      <span class="glyph">HN</span>
      <span class="body">
        <span class="name">Hardly Normal Staff</span>
        <span class="desc">Barcode lookup and other counter tools</span>
      </span>
      <svg class="chev" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>

    <!-- Copy the block above to add a tool. Change href, glyph, name, desc. -->

  </nav>

  <p class="foot">Self-hosted</p>

</main>
</body>
</html>
